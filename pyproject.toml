[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-ids"
version = "0.1.0"
description = "Experiment modules for the image-based GPS-spoofing intrusion detection study"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["gps_ids"]
py-modules = ["eval_metrics"]
